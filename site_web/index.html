<body>

    <header class="navbar">
        <div class="logo"><a href="https://my-gamers-stats.com"><img src="content/image/mgs_letters.png" width="100"></a></div>
        <div class="login"><a href="/connexion/index.php">Connexion</a></div>
    </header>

    <main>
        <div class="titre">
            <img src="content/image/mgs_letters.png" width="700">
        </div>
    </br>
    </br>
    <div class="hero-text">
        <h1>Bienvenue sur <span>my-gamers-stats.com</span></h1>
        <p>Recherchez un Steam ID, un pseudo ou un Riot ID pour découvrir vos statistiques.</p>
    </div>
    </br>
        <form action="" method="get" class="form-example" id="statsForm">
            <div class="platform-card">
                <div class="platform-select" id="platformSelect">
                    <div class="platform-toggle" id="platformToggle">
                        <span class="label"></span>
                        <span class="value" id="platformValue"><span class="arrow">▾</span></span>
                    </div>
                    <ul class="platform-menu" id="platformMenu">
                        <li data-value="Steam">Steam</li>
                        <li data-value="Riot">Riot</li>
                        <li data-value="Epic Games">Epic Games</li>
                    </ul>
                </div>

                <div class="divider"></div>

                <div class="pseudo">
                    <span class="label"></span>
                    <input type="text" id="pseudoField" class="pseudo-field" placeholder="Entrez votre pseudo (ID)">
                </div>
                <button type="submit" class="search-btn">Rechercher</button>
            </div>
        </form>

        <div class="compte">
            <div id="stats-result" class="stats-result"></div>
        </div>
        <!-- Modale pour l'image agrandie -->
        <div id="imageModal" class="image-modal">
            <span class="image-modal-close">&times;</span>
            <img class="image-modal-content" id="imageModalContent">
        </div>
    </main>

    <script src="js/stats-display.js?v=1"></script>
    <script src="js/acceuil.js?v=3"></script>
    <script src="js/runner-bg.js" defer></script>
    
</body>
