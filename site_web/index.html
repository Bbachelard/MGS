<!DOCTYPE html>
    <html lang="fr">
        <HEAD>  
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>My gamers stats.</title>
            <link rel="stylesheet" href="content/css/stylesheet.css">
            <link rel="stylesheet" href="content/css/styleAceuil.css">
        </HEAD>
        <body>

            <header class="navbar">
                <div class="logo"><a href=""><img src="content/image/mgs_letters.png" width="100"></a></div>
                <nav class="nav-icons">
                    <div class="nav-box"><a href=""><img src="content/image/Steam_icon.webp" width="50"></a></div>
                    <div class="nav-box"><a href=""><img src="content/image/riot-icon.png" width="50"></a></div>
                    <div class="nav-box"><a href=""><img src="content/image/Epic_icon.webp" width="50"></a></div>


                </nav>
                <div class="login"><a href="">Connexion</a></div>
            </header>
            
            <main>
                
                <div class="titre">
                    <h1>Bienvenue dur My Gamers Stats</h1>
                </div>
                <form action="" method="get" class="form-example" id="statsForm">
                        
                        <div class="platform-card">
                        <div class="platform-select" id="platformSelect">
                            <div class="platform-toggle" id="platformToggle">
                                <span class="label"></span>
                                <span class="value" id="platformValue"><span class="arrow">▾</span></span>
                            </div>
                            <ul class="platform-menu" id="platformMenu">
                                <li data-value="Steam">Steam</li>
                                <li data-value="Riot">Riot</li>
                                <li data-value="Epic Games">Epic Games</li>
                            </ul>
                        </div>

                        <div class="divider"></div>
                       
                        <div class="pseudo">
                            <span class="label"></span>
                            <input type="text" id="pseudoField" class="pseudo-field" placeholder="Entrez votre pseudo (ID)">
                        </div>
                        <button type="submit" class="search-btn">Rechercher</button>
                        
                        <div id="stats-result" class="stats-result"></div>
                        </div>
                        
            
           
                </form>
            </main>

            

            <script src="js/acceuil.js"></script>
        </body>

    </html>
