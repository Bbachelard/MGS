# ============================================================================
#  mgs-arene.conf — Apache passe /jeu/ au conteneur `arene`.
#
#  À inclure DANS le <VirtualHost> de my-gamers-stats.com (celui qui sert le
#  site), pas à côté. Si le site a un vhost :80 et un vhost :443, mets-le dans
#  les deux — ou dans le :443 seul si le :80 ne fait que rediriger.
#
#  Modules requis, une seule fois :
#      a2enmod proxy proxy_http proxy_wstunnel
#  (dans le Dockerfile de l'image Apache, sinon ça repart à chaque rebuild.)
#
#  `arene` est le nom du service dans docker-compose.yml : Docker le résout
#  en adresse IP sur le réseau du projet. Les deux conteneurs doivent donc
#  être dans le MÊME docker-compose.yml (ou partager un réseau déclaré).
# ============================================================================

# L'ordre compte : la règle la plus précise d'abord.
# Si /jeu/ passait avant, le WebSocket serait relayé comme du HTTP simple et
# le navigateur afficherait « Error during WebSocket handshake ».
ProxyPass        /jeu/ws  ws://arene:8080/ws
ProxyPassReverse /jeu/ws  ws://arene:8080/ws

# Le reste : la page du jeu, shared.js, la sonde /jeu/sante.
ProxyPass        /jeu/    http://arene:8080/
ProxyPassReverse /jeu/    http://arene:8080/

# /jeu sans barre oblique finale : sans ça, les chemins relatifs de la page
# (shared.js, ws) se résoudraient à la racine du site.
RedirectMatch 301 ^/jeu$ /jeu/

# On ne relaie pas les requêtes de proxy « classiques » (le serveur n'est pas
# un proxy ouvert). C'est déjà le défaut d'Apache, on l'écrit pour mémoire.
ProxyRequests Off

<Proxy "http://arene:8080/*">
    Require all granted
</Proxy>
