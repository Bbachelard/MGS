# ============================================================================
#  mgs-arene.conf — Apache passe /jeu/ au conteneur `arene`.
#
#  À monter dans le conteneur Apache à cet emplacement :
#      /etc/apache2/conf-enabled/mgs-arene.conf
#  via ce volume, dans le service `apache` du docker-compose.yml :
#      - ./mgs-arene.conf:/etc/apache2/conf-enabled/mgs-arene.conf:ro
#
#  apache2.conf termine par « IncludeOptional conf-enabled/*.conf » : le
#  fichier est donc chargé au niveau SERVEUR, pas dans un <VirtualHost>.
#  C'est voulu ici — le site n'a qu'un vhost (*:80, celui de l'image
#  php:8.3-apache), et une règle de niveau serveur s'applique à tous les
#  vhosts sans avoir à éditer un fichier qui vit dans l'image.
#
#  Le monter plutôt que le copier dans l'image permet de le corriger avec un
#  simple `docker compose restart apache`, sans reconstruire.
#
#  Modules requis — déjà dans le Dockerfile :
#      RUN a2enmod proxy proxy_http proxy_wstunnel
#  Attention : ajouter cette ligne ne suffit pas, il faut RECONSTRUIRE
#  l'image (`docker compose up -d --build apache`). Un simple restart
#  redémarre l'ancienne image, sans les modules.
#
#  `arene` est le nom du service dans docker-compose.yml : Docker le résout
#  en adresse IP, à condition que les deux conteneurs soient sur le MÊME
#  réseau (ici le réseau externe `web`).
# ============================================================================

# L'ordre compte : la règle la plus précise d'abord.
# Si /jeu/ passait avant, le WebSocket serait relayé comme du HTTP simple et
# le navigateur afficherait « Error during WebSocket handshake ».
ProxyPass        /jeu/ws  ws://arene:8080/ws
ProxyPassReverse /jeu/ws  ws://arene:8080/ws

# Le reste : la page du jeu, shared.js, la sonde /jeu/sante.
ProxyPass        /jeu/    http://arene:8080/
ProxyPassReverse /jeu/    http://arene:8080/

# /jeu sans barre oblique finale : sans ça, les chemins relatifs de la page
# (shared.js, ws) se résoudraient à la racine du site.
RedirectMatch 301 ^/jeu$ /jeu/

# On ne relaie pas les requêtes de proxy « classiques » (le serveur n'est pas
# un proxy ouvert). C'est déjà le défaut d'Apache, on l'écrit pour mémoire.
ProxyRequests Off

<Proxy "http://arene:8080/*">
    Require all granted
</Proxy>

<Proxy "ws://arene:8080/*">
    Require all granted
</Proxy>
