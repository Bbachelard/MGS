name = "mgs-arene"
main = "src/server.js"
compatibility_date = "2025-03-01"

# Les fichiers statiques (le client) sont servis directement par Cloudflare.
# Toute URL qui ne correspond pas à un fichier tombe sur le Worker (donc /ws).
[assets]
directory = "./public"

# Le Durable Object : c'est LUI le serveur de jeu.
[[durable_objects.bindings]]
name = "ARENA"
class_name = "ArenaRoom"

# Obligatoire : déclare la classe. "new_sqlite_classes" = version
# disponible sur le plan GRATUIT de Cloudflare.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArenaRoom"]
