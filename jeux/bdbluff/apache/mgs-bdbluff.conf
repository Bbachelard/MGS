# ============================================================================
#  mgs-bdbluff.conf — Apache passe /bd/ au conteneur `bdbluff`.
#
#  À monter dans le conteneur Apache à cet emplacement :
#      /etc/apache2/conf-enabled/mgs-bdbluff.conf
#  via ce volume, dans le service `apache` du docker-compose.yml :
#      - ./mgs-bdbluff.conf:/etc/apache2/conf-enabled/mgs-bdbluff.conf:ro
#
#  apache2.conf termine par « IncludeOptional conf-enabled/*.conf » : le
#  fichier est donc chargé au niveau SERVEUR, exactement comme
#  mgs-arene.conf — les deux jeux cohabitent sans se marcher dessus tant que
#  leurs préfixes (/jeu/ et /bd/) restent distincts.
#
#  Le monter plutôt que le copier dans l'image permet de le corriger avec un
#  simple `docker compose restart apache`, sans reconstruire.
#
#  Modules requis — déjà activés pour l'Arène, rien de plus à faire :
#      RUN a2enmod proxy proxy_http proxy_wstunnel
#
#  `bdbluff` est le nom du service dans docker-compose.yml : Docker le
#  résout en adresse IP, à condition que les deux conteneurs soient sur le
#  MÊME réseau (ici le réseau externe `web`, comme `arene`).
# ============================================================================

# L'ordre compte : la règle la plus précise d'abord.
# Si /bd/ passait avant, le WebSocket serait relayé comme du HTTP simple et
# le navigateur afficherait « Error during WebSocket handshake ».
ProxyPass        /bd/ws  ws://bdbluff:8080/ws
ProxyPassReverse /bd/ws  ws://bdbluff:8080/ws

# Le reste : la page du jeu, shared.js, themes.js, les stickers, /bd/sante.
ProxyPass        /bd/    http://bdbluff:8080/
ProxyPassReverse /bd/    http://bdbluff:8080/

# /bd sans barre oblique finale : sans ça, les chemins relatifs de la page
# (shared.js, stickers/, ws) se résoudraient à la racine du site.
RedirectMatch 301 ^/bd$ /bd/

ProxyRequests Off

<Proxy "http://bdbluff:8080/*">
    Require all granted
</Proxy>

<Proxy "ws://bdbluff:8080/*">
    Require all granted
</Proxy>
